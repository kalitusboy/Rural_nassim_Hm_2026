name: Build Android APK (Manual)

on:
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً من واجهة GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # تم التحديث إلى 3.22.0 لحل مشاكل WidgetStateProperty و Color.a
          flutter-version: '3.22.0' 
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        # استخدام split-per-abi لإنتاج ملفات أخف وزناً
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ihsaa-v8-ARM64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ihsaa-v8-ARMv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Ihsaa-v8-Universal
          path: build/app/outputs/flutter-apk/app-release.apk
          
